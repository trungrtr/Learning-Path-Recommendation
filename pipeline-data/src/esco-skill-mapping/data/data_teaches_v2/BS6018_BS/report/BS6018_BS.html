<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Mapping Report - BS6018_BS</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --accept-bg: #064e3b;
    --accept-text: #34d399;
    --review-bg: #78350f;
    --review-text: #fbbf24;
    --reject-bg: #7f1d1d;
    --reject-text: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 32px 24px; line-height: 1.5; }
  .container { max-width: 1300px; margin: 0 auto; }
  .header { margin-bottom: 28px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  h1 { font-size: 26px; font-weight: 700; color: #38bdf8; margin-bottom: 8px; }
  .meta { color: var(--text-muted); font-size: 14px; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; }
  .stat-num { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
  .badge-accept { background: var(--accept-bg); color: var(--accept-text); border: 1px solid rgba(52,211,153,0.3); }
  .badge-review { background: var(--review-bg); color: var(--review-text); border: 1px solid rgba(251,191,36,0.3); }
  .badge-reject { background: var(--reject-bg); color: var(--reject-text); border: 1px solid rgba(248,113,113,0.3); }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  th { background: #182234; padding: 12px 14px; text-align: left; font-size: 13px; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border); }
  td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:hover { background: rgba(255,255,255,0.02); }
  .score { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Course Skill Mapping Report: BS6018_BS</h1>
    <div class="meta">Course Name: <strong>Communication in the Working Environment</strong> | Generated: </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-num" style="color: #38bdf8;">0</div><div class="stat-label">Total Evaluated</div></div>
    <div class="stat-card"><div class="stat-num" style="color: #34d399;">0</div><div class="stat-label">Accepted Skills</div></div>
    <div class="stat-card"><div class="stat-num" style="color: #fbbf24;">0</div><div class="stat-label">In Review</div></div>
    <div class="stat-card"><div class="stat-num" style="color: #f87171;">0</div><div class="stat-label">Rejected</div></div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width: 16%;">Mention gốc</th>
        <th style="width: 25%;">Câu evidence trong syllabus</th>
        <th style="width: 20%;">ESCO Skill đề xuất</th>
        <th style="width: 8%;">Loại</th>
        <th style="width: 9%;">Score</th>
        <th style="width: 14%;">LLM Reasoning</th>
        <th style="width: 8%;">Quyết định</th>
      </tr>
    </thead>
    <tbody>
      
    </tbody>
  </table>
</div>
</body>
</html>
